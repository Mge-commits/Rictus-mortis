<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Rictus Mortis</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ff;--surface:#ffffff;--card:#ffffff;--text:#1b1830;--muted:#6d6985;--line:#e3e0ef;
  --accent:#6d4aff;--accent2:#ff4fa3;--accent-ink:#fff;--danger:#e5484d;--ok:#18a864;--shadow:0 6px 24px rgba(40,30,90,.12);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0e0d16;--surface:#171525;--card:#1c1a2e;--text:#f1eefc;--muted:#9a96b5;--line:#2b2842;--accent:#8b6dff;--accent2:#ff5fae;--danger:#ff6369;--ok:#3ddc97;--shadow:0 6px 24px rgba(0,0,0,.5)}
}
:root[data-theme="dark"]{--bg:#0e0d16;--surface:#171525;--card:#1c1a2e;--text:#f1eefc;--muted:#9a96b5;--line:#2b2842;--accent:#8b6dff;--accent2:#ff5fae;--danger:#ff6369;--ok:#3ddc97;--shadow:0 6px 24px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4}
button,input,textarea,select{font:inherit;color:inherit}
h1{font-size:2.3rem;line-height:1;font-weight:800;letter-spacing:-.04em;margin:0}
h2{font-size:1.5rem;font-weight:800;margin:.2rem 0 .3rem;letter-spacing:-.02em}
h3{font-size:1.05rem;font-weight:700;margin:1.2rem 0 .5rem}
.muted{color:var(--muted)}.small{font-size:.85rem}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}

.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:54px}
.logo{font-weight:800;font-size:1.15rem;letter-spacing:-.03em}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:.9rem}
main{padding:16px 0 130px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav .row{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);font-weight:600;position:relative;cursor:pointer}
nav button .i{font-size:1.35rem;line-height:1}
nav button.on{color:var(--accent)}
.badge{position:absolute;top:0;right:22%;background:var(--accent2);color:#fff;border-radius:99px;font-size:.65rem;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}

label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
input[type=text],input[type=password],textarea,select{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;min-height:120px;word-break:break-all}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:var(--accent-ink);border:0;border-radius:14px;padding:13px 18px;font-weight:700;cursor:pointer;width:100%;margin-top:14px}
.btn.sec{background:var(--surface);color:var(--text);border:1.5px solid var(--line)}
.btn.bad{background:var(--danger)}
.btn.sm{width:auto;padding:9px 14px;margin-top:0;border-radius:11px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--danger);font-weight:600;margin-top:12px;font-size:.92rem}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:.88rem;color:var(--muted);margin-top:12px}
.photo{display:grid;place-items:center;border:2px dashed var(--line);border-radius:16px;min-height:120px;overflow:hidden;cursor:pointer;background:var(--surface);color:var(--muted);font-weight:600;margin:0}
.photo img{width:100%;max-height:220px;object-fit:cover;display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:3px;margin-bottom:6px}
.seg button{border:0;background:none;padding:9px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* landing */
.land{min-height:100vh;padding:28px 16px 40px;max-width:460px;margin:0 auto}
.fan{position:relative;height:210px;margin:6px 0 10px}
.fan .card{position:absolute;width:128px;top:8px;left:50%}
.fan .card:nth-child(1){transform:translateX(-118%) rotate(-12deg)}
.fan .card:nth-child(2){transform:translateX(-50%) translateY(-10px) rotate(0);z-index:2}
.fan .card:nth-child(3){transform:translateX(18%) rotate(12deg)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-top:14px}
.pts{display:grid;gap:8px;margin:14px 0 0;padding:0;list-style:none;font-size:.95rem}

/* cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{--tc:#9aa3b2;position:relative;overflow:hidden;border-radius:18px;padding:9px;border:2px solid var(--tc);
  background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 26%,var(--card)),var(--card) 72%);
  box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
.card.t3,.card.t4,.card.t5{box-shadow:0 0 18px color-mix(in srgb,var(--tc) 50%,transparent),var(--shadow)}
.card.t4::after,.card.t5::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 46%,transparent 62%);background-size:260% 100%;animation:shine 3.4s linear infinite}
@keyframes shine{from{background-position:160% 0}to{background-position:-110% 0}}
@media (prefers-reduced-motion:reduce){.card.t4::after,.card.t5::after{animation:none}.flip-in{transition:none!important}.reveal{animation:none!important}}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.ctop .tier{color:var(--tc)}.ctop .cp{color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0}
.art{aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#888}
.art svg,.art img{width:100%;height:100%;display:block;object-fit:cover}
.ctitle{font-weight:800;line-height:1.12;letter-spacing:-.01em;overflow-wrap:anywhere}
.card.mini .ctitle{font-size:.88rem}
.cfoot{display:flex;justify-content:space-between;gap:6px;font-size:.7rem;color:var(--muted);font-weight:600}
.flavor{font-size:.82rem;color:var(--muted);font-style:italic}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:color-mix(in srgb,var(--tc) 13%,var(--surface));border-radius:10px;padding:5px 9px;display:flex;justify-content:space-between;font-size:.78rem;font-weight:700}
.stat span:first-child{color:var(--muted);font-weight:600}
.card.full{cursor:default;padding:12px;gap:9px}
.card.full .ctitle{font-size:1.3rem}
.card.sel{outline:3px solid var(--accent);outline-offset:2px}
.qty{position:absolute;top:8px;right:8px;z-index:3;background:var(--accent2);color:#fff;font-weight:800;font-size:.75rem;border-radius:99px;padding:2px 8px}
.keep{position:absolute;top:8px;right:8px;z-index:3;background:var(--ok);color:#06210f;font-weight:800;font-size:.68rem;border-radius:99px;padding:2px 8px}
.ghost{aspect-ratio:3/4;border-radius:14px;border:2px dashed color-mix(in srgb,var(--tc) 60%,transparent);display:grid;place-items:center;color:var(--muted);font-weight:800;font-size:.8rem;cursor:default;box-shadow:none;background:var(--surface)}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.tile b{display:block;font-size:1.35rem;letter-spacing:-.02em}.tile span{font-size:.72rem;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.row2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btnrow{display:flex;gap:8px;margin-top:10px}.btnrow .btn{margin-top:0}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.tl li:last-child{border-bottom:0}
.tl time{display:block;color:var(--muted);font-size:.74rem}
.empty{text-align:center;padding:34px 10px;color:var(--muted)}.empty .e{font-size:2.6rem}

/* booster */
.packwrap{display:grid;place-items:center;padding:6px 0 4px}
.pack{width:170px;height:230px;border-radius:18px;position:relative;overflow:hidden;border:0;cursor:pointer;color:#fff;
  background:linear-gradient(145deg,#6d4aff,#ff4fa3 60%,#ffb020);box-shadow:0 14px 40px rgba(109,74,255,.45);display:grid;place-items:center;font-weight:800}
.pack::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(60deg,rgba(255,255,255,.12) 0 10px,transparent 10px 22px)}
.pack::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 48%,transparent 60%);background-size:250% 100%;animation:shine 2.6s linear infinite}
.pack .in{position:relative;z-index:1;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.pack .in .big{font-size:3.6rem;display:block;line-height:1}
.pack.ready{animation:wob 2.4s ease-in-out infinite}
.pack:disabled{filter:grayscale(.85) brightness(.8);animation:none;box-shadow:none;cursor:default}
.pack:disabled::after{display:none}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) scale(1.03)}}
.timer{font-variant-numeric:tabular-nums;font-weight:800}

/* reveal */
.rev{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--tc,#6d4aff) 40%,#0b0a14),#0b0a14 70%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto}
.rev .stage{flex:1;display:grid;place-items:center;width:100%}
.flip{width:min(270px,70vw);perspective:900px;cursor:pointer}
.flip-in{position:relative;transition:transform .6s;transform-style:preserve-3d;aspect-ratio:3/4.5}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{transform:rotateY(180deg);display:flex}
.face.front .card{width:100%;height:100%;justify-content:flex-start}
.face.back{border-radius:18px;background:linear-gradient(145deg,#6d4aff,#ff4fa3 60%,#ffb020);display:grid;place-items:center;font-size:4rem;border:3px solid rgba(255,255,255,.7);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.rev .info{visibility:hidden;text-align:center;min-height:52px;margin-top:12px;font-weight:800;font-size:1.05rem}
.rev .hint{opacity:.7;font-size:.85rem;margin-top:6px}
.rev .btn.sec{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.rev .grid{width:100%;max-width:560px}
.reveal{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}

.selbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:25;padding:0 16px}
.selbar .in{max-width:640px;margin:0 auto;background:var(--surface);border:1.5px solid var(--accent);border-radius:16px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadow)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,8,20,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .x{float:right;background:var(--surface);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.spin{width:18px;height:18px;border:3px solid color-mix(in srgb,currentColor 30%,transparent);border-top-color:currentColor;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.prow{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;flex:none}
.tpair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:8px 0}
.tpair .arrow{font-size:1.3rem;color:var(--muted)}
.gift{display:grid;place-items:center;height:100%;min-height:120px;border:2px dashed var(--line);border-radius:16px;font-weight:700;color:var(--muted)}
.slogan{background:linear-gradient(90deg,#f6ecd2,#fff7e0);color:#4a3210;border:1px solid #c9955a;border-radius:6px;padding:4px 8px;font-size:.76rem;font-weight:800;text-align:center;margin:-16px 8px 0;position:relative;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.28);line-height:1.2}
.face.back{padding:0;overflow:hidden;font-size:1rem}
.face.back svg{width:100%;height:100%;display:block}
.pack{height:255px;background:#1a0b45}
.pack::before{display:none}
.pack .pk{position:absolute;inset:0;z-index:0}.pack .pk svg{width:100%;height:100%;display:block}
.pack .pklabel{position:absolute;left:-6px;right:-6px;bottom:30px;z-index:2;text-align:center;font-weight:800;font-size:.78rem;letter-spacing:.08em;background:linear-gradient(90deg,#ff4fa3,#ffb020);color:#fff;padding:5px 0;transform:rotate(-4deg);box-shadow:0 3px 10px rgba(0,0,0,.45);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.face.back.t4::after,.face.back.t5::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 46%,transparent 62%);background-size:260% 100%;animation:shine 3.2s linear infinite}
.desc{font-size:.7rem;color:var(--muted);line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.face.front .desc{-webkit-line-clamp:5;font-size:.74rem}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;background:#8d99ad}
.dot.on{background:#3ddc97;box-shadow:0 0 0 3px rgba(61,220,151,.28)}
.dot.recent{background:#ffb020}
.dot.idle{background:#8d99ad}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
"use strict";
/* =============== utils =============== */
const $app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const slug = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 80);
const fmt = t => new Date(t).toLocaleString('fr-FR', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
const fnv = s => { let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const rngOf = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const b64u = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));
const emo = s => { const a = [...String(s || '')].filter(ch => ch.codePointAt(0) > 255).slice(0, 2).join(''); return a; };
let toastT; function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

/* storage (localStorage si dispo, sinon mémoire) */
const mem = new Map(); let storageOK = true;
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ storageOK = false; return mem.has(k) ? JSON.parse(mem.get(k)) : null; } },
  set(k, v){ const s = JSON.stringify(v); try{ localStorage.setItem(k, s); }catch(e){ storageOK = false; mem.set(k, s); } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ mem.delete(k); } }
};

/* =============== raretés =============== */
const TIERS = [
  {n:'Commune', min:0, c:'#9aa3b2', w:50, share:.42},
  {n:'Peu commune', min:35, c:'#2fbf7f', w:28, share:.27},
  {n:'Rare', min:55, c:'#3d9bff', w:14, share:.15},
  {n:'Épique', min:72, c:'#a468ff', w:6, share:.09},
  {n:'Légendaire', min:85, c:'#ffb020', w:1.8, share:.05},
  {n:'Mythique', min:94, c:'#ff4fa3', w:.2, share:.02}
];
const tierIdx = sc => { let k = 0; TIERS.forEach((t, i) => { if (sc >= t.min) k = i; }); return k; };
const DECAY = .78, MAX_CIRC = 8, MAX_STOCK = 3, EVERY = 5 * 60 * 1000;
let CAT_SIZE = 0;

/* invitations */
const ARTIFACT_URL = 'https://claude.ai/artifact/3KUHbpUAF21EhiyHC9t9tU', SECRET = 'cl-loufoques-v3-9xQ', FOUNDER_CODE = 'FONDATEUR-LOUFOQUE';
const invCheck = p => fnv('inv|' + p.toLowerCase() + '|' + SECRET).toString(36).slice(0, 5);
const invCode = p => 'INV-' + p + '-' + invCheck(p);
function parseInv(raw){
  const s = String(raw || '').trim();
  if (s.toUpperCase() === FOUNDER_CODE) return {ok:true, founder:true};
  const m = s.match(/^INV-([A-Za-z0-9_-]{3,20})-([a-z0-9]{1,5})$/i);
  if (!m || m[2].toLowerCase() !== invCheck(m[1])) return {ok:false};
  return {ok:true, inviter:m[1]};
}
function urlInvite(){
  const srcs = [];
  try{ srcs.push(location.search + location.hash); }catch(e){}
  try{ if (document.referrer){ const u = new URL(document.referrer); srcs.push(u.search + u.hash); } }catch(e){}
  try{ srcs.push(window.top.location.search + window.top.location.hash); }catch(e){}
  for (const x of srcs){ const m = x.match(/[?&#]invite=([A-Za-z0-9_.-]+)/); if (m) return m[1]; }
  return '';
}

  const j = JSON.parse(m[0]), score = clamp(Math.round(Number(j.score)), 0, 100); if (isNaN(score)) throw new Error('note');
  return {score, dup:j.duplicateOf && known.includes(j.duplicateOf) ? j.duplicateOf : null, refuse:j.refuse ? String(j.refuse) : null,
    stats:(Array.isArray(j.stats) ? j.stats : []).slice(0, 4).map(s => ({n:String(s.n || '?').slice(0, 10), v:clamp(Math.round(Number(s.v)) || 1, 1, 100)})),
    flavor:String(j.flavor || '').slice(0, 200), slogan:String(j.slogan || '').slice(0, 90), verdict:String(j.verdict || '').slice(0, 300), e1:emo(j.emoji), e2:emo(j.emoji2)};

function evaluateLocal(title, desc, hasImg, seed){

  const names = []; while (names.length < 4){ const n = STATN[Math.floor(r() * STATN.length)]; if (!names.includes(n)) names.push(n); }
  return {score, dup:null, refuse:null, stats:names.map(n => ({n, v:Math.round(15 + r() * 70)})), flavor:desc ? desc.slice(0, 170) : flavorOf(r), slogan:SLOG[Math.floor(r() * SLOG.length)],
    verdict:'Cotation locale (IA indisponible) : richesse du titre, de la description et de la photo.', e1:OBJ[seed % OBJ.length].e, e2:ACT[(seed >> 3) % ACT.length].e};
}
async function generate(){
  const f = S.cf; if (f.busy) return;
  const title = f.title.trim(), desc = f.desc.trim(), key = slug(title);
  if (title.length < 2 || !key){ f.err = 'Donne un sujet à ta carte.'; return render(); }
  if (BAD.test(norm(title) + ' ' + norm(desc))){ f.err = 'Contenu refusé par la validation.'; return render(); }
  const known = new Set(CAT_KEYS); Object.values(S.D.custom).forEach(c => known.add(slug(c.n)));
  if (known.has(key)){ f.err = 'Ce sujet existe déjà : une carte unique ne peut être créée qu’une seule fois.'; return render(); }
  f.busy = true; f.err = ''; f.status = 'Examen de la carte…'; render();
  try{
    let ev = null, ai = false;
    if (!S.sampleReady){ f.status = 'Connexion à l’IA…'; render(); for (let k = 0; k < 12 && !S.sampleReady; k++) await new Promise(r => setTimeout(r, 250)); }
    if (S.sample){ f.status = 'L’IA note ta carte…'; render(); try{ ev = await evaluateAI(title, desc, f.img && f.img.blob); ai = true; }catch(e){ ev = null; } }
    if (!ev) ev = evaluateLocal(title, desc, !!f.img, fnv(key));
    if (ev.refuse) throw new Error('Carte refusée : ' + ev.refuse);
    if (ev.dup) throw new Error('Ce sujet ressemble trop à la carte « ' + ev.dup + ' ».');
    const seed = fnv(key), id = 'u_' + seed.toString(36);
    const card = {custom:true, id, n:title, score:ev.score, stats:ev.stats, flavor:ev.flavor || desc, slogan:ev.slogan || '', verdict:ev.verdict,
      e1:ev.e1 || OBJ[seed % OBJ.length].e, e2:ev.e2 || ACT[(seed >> 3) % ACT.length].e, seed, photo:f.img ? f.img.url : null, creator:S.me, circ:1, at:Date.now()};
    S.D.custom[id] = card; S.D.inv[id] = 1; S.D.at[id] = Date.now(); S.D.created++;
    pushLog('create', `Carte créée : « ${title} » (${TIERS[tierIdx(ev.score)].n})`); saveD();
    f.result = id; f.ai = ai; f.busy = false; render();
  }catch(e){ f.busy = false; f.err = e.message || 'Erreur inattendue.'; render(); }
}
function processImage(file){
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = () => rej(new Error('Lecture impossible.'));
    fr.onload = () => { const im = new Image(); im.onerror = () => rej(new Error('Format d’image non pris en charge.'));
      im.onload = () => { const r = Math.min(1, 240 / Math.max(im.width, im.height)), cv = document.createElement('canvas');
        cv.width = Math.round(im.width * r); cv.height = Math.round(im.height * r); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        let q = .6, url = cv.toDataURL('image/jpeg', q); while (url.length > 40000 && q > .25){ q -= .08; url = cv.toDataURL('image/jpeg', q); }
        cv.toBlob(blob => res({url, blob}), 'image/jpeg', q); };
      im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

const friendOf = p => S.D.friends.find(f => lk(f.pseudo) === lk(p));
function addFriend(raw){
  const p = String(raw || '').trim();
  if (!PSEUDO_RE.test(p)) return toast('Pseudo invalide (3 à 20 caractères : lettres, chiffres, - ou _).');
  if (lk(p) === lk(S.me)) return toast('C’est toi, ça !');

  S.D.friends.push({pseudo:p, at:Date.now(), snap:null}); pushLog('friend', `Ami ajouté : ${p}`); saveD(); toast(p + ' ajouté !'); render();
}
function packCustom(c, circ){ return {n:c.n, flavor:c.flavor, slogan:c.slogan, score:c.score, stats:c.stats, verdict:c.verdict, e1:c.e1, e2:c.e2, photo:c.photo, creator:c.creator, circ}; }
function cleanCustom(x){
  if (!x || typeof x.n !== 'string' || !x.n.trim()) return null;
  const key = slug(x.n); if (!key) return null;
  const photo = typeof x.photo === 'string' && x.photo.length < 90000 && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(x.photo) ? x.photo : null, seed = fnv(key);
  return {custom:true, id:'u_' + seed.toString(36), n:x.n.slice(0, 60), flavor:String(x.flavor || '').slice(0, 220), slogan:String(x.slogan || '').slice(0, 90), score:clamp(+x.score || 0, 0, 100),
    stats:(Array.isArray(x.stats) ? x.stats : []).slice(0, 4).map(s => ({n:String(s.n || '?').slice(0, 12), v:clamp(Math.round(+s.v) || 1, 1, 100)})),
    verdict:String(x.verdict || '').slice(0, 300), e1:emo(x.e1) || '🃏', e2:emo(x.e2), seed, photo, creator:String(x.creator || '?').slice(0, 20), circ:clamp(Math.round(+x.circ) || 1, 1, MAX_CIRC), at:Date.now()};
}
const wrapCode = (prefix, obj) => { const j = JSON.stringify(obj); return prefix + '.' + b64u(j) + '.' + fnv(j).toString(36); };
function unwrapCode(txt, prefix){
  const parts = String(txt).replace(/\s+/g, '').split('.');
  if (parts.length !== 3 || parts[0] !== prefix) throw new Error('Ce n’est pas un code valide.');
  let json; try{ json = unb64u(parts[1]); }catch(e){ throw new Error('Code corrompu ou incomplet.'); }
  if (fnv(json).toString(36) !== parts[2]) throw new Error('Code corrompu ou incomplet (vérifie qu’il est entier).');
  return JSON.parse(json);
}
function makeCode(){
  const D = S.D, ids = [...S.sel];
  if (!S.to || !friendOf(S.to)){ toast('Choisis d’abord un ami destinataire.'); return; }
  if (!ids.length) return;
  for (const id of ids){ const c = getCard(id); if (!c || !(D.inv[id] > 0)){ toast('Une carte n’est plus disponible.'); return; } if (isMine(c) && (c.circ || 1) >= MAX_CIRC){ toast('« ' + c.n + ' » a atteint ses ' + MAX_CIRC + ' exemplaires.'); return; } }
  const undo = [], cards = [];
  ids.forEach(id => {
    const c = getCard(id);
    if (!c.custom){ cards.push({id}); D.inv[id]--; undo.push({id, dec:true}); }
    else if (isMine(c)){ c.circ = (c.circ || 1) + 1; cards.push({x:packCustom(c, c.circ)}); undo.push({id, circ:true}); }
    else { cards.push({x:packCustom(c, c.circ || 1)}); D.inv[id]--; undo.push({id, dec:true}); }
  });
  const code = wrapCode('CARTES1', {t:Date.now().toString(36) + Math.random().toString(36).slice(2, 7), f:S.me, to:S.to, c:cards});
  D.sent += ids.length; pushLog('send', `Envoyé à ${S.to} : ${ids.map(i => '« ' + getCard(i).n + ' »').join(', ')}`);
  S.sel = new Set(); saveD(); S.modal = {type:'code', code, undo, n:ids.length, to:S.to}; render();
}
function cancelSend(){
  const m = S.modal; if (!m || m.type !== 'code') return;
  m.undo.forEach(u => { if (u.dec) S.D.inv[u.id] = (S.D.inv[u.id] || 0) + 1; if (u.circ && S.D.custom[u.id]) S.D.custom[u.id].circ--; });
  S.D.sent -= m.n; S.D.log.shift(); saveD(); S.modal = null; toast('Envoi annulé, cartes récupérées.'); render();
}
function makeProfileCode(){
  const D = S.D, own = ownedIds(), dups = own.filter(id => id[0] === 'c' && D.inv[id] > 1).slice(0, 40);
  return wrapCode('CARTESAMI1', {t:Date.now().toString(36), f:S.me, u:own.length, n:own.reduce((a, id) => a + D.inv[id], 0), d:dups, at:Date.now()});
}
function readCode(){
  try{
    const txt = S.importTxt.replace(/\s+/g, '');
    if (txt.startsWith('CARTESAMI1.')){
      const p = unwrapCode(txt, 'CARTESAMI1'), from = String(p.f || '').slice(0, 20);
      if (!PSEUDO_RE.test(from) || lk(from) === lk(S.me)) throw new Error('Profil invalide.');
      let fr = friendOf(from); if (!fr){ fr = {pseudo:from, at:Date.now(), snap:null}; S.D.friends.push(fr); }
      fr.snap = {uniq:clamp(+p.u || 0, 0, 5000), total:clamp(+p.n || 0, 0, 99999), dups:(Array.isArray(p.d) ? p.d : []).filter(id => /^c\d+$/.test(id) && CAT[+id.slice(1)]).slice(0, 40), at:+p.at || Date.now()};
      saveD(); S.importTxt = ''; S.modal = {type:'friend', p:fr.pseudo}; toast('Profil de ' + from + ' mis à jour.'); return render();
    }
    const p = unwrapCode(txt, 'CARTES1');
    if (!Array.isArray(p.c) || p.c.length > 8) throw new Error('Code invalide.');
    if (lk(p.to || '') !== lk(S.me)) throw new Error('Ce code est destiné à ' + String(p.to || '?').slice(0, 20) + ', pas à ' + S.me + '.');
    const from = String(p.f || '?').slice(0, 20);
    if (S.D.imported.includes(String(p.t))) throw new Error('Ce code a déjà été utilisé sur ce compte.');
    const cards = p.c.map(x => x.id ? (/^c\d+$/.test(x.id) && CAT[+x.id.slice(1)] ? {id:x.id} : null) : (cleanCustom(x.x) ? {x:cleanCustom(x.x)} : null));
    if (cards.some(c => !c)) throw new Error('Le code contient une carte invalide.');
    S.modal = {type:'import', p:{t:String(p.t), f:from, cards}};
  }catch(e){ toast(e.message); }
  render();
}
function acceptImport(){
  const p = S.modal.p, D = S.D; if (D.imported.includes(p.t)) return;
  p.cards.forEach(c => { const id = c.id || c.x.id; if (c.x && !D.custom[id]) D.custom[id] = c.x; D.inv[id] = (D.inv[id] || 0) + 1; if (!D.at[id]) D.at[id] = Date.now(); });
  D.imported.push(p.t); D.recv += p.cards.length;
  if (!friendOf(p.f) && PSEUDO_RE.test(p.f)) D.friends.push({pseudo:p.f, at:Date.now(), snap:null});
  pushLog('recv', `Reçu de ${p.f} : ${p.cards.map(c => '« ' + (c.id ? CAT[+c.id.slice(1)].n : c.x.n) + ' »').join(', ')}`);
  saveD(); S.modal = null; S.importTxt = ''; S.tab = 'collection'; toast('Cartes ajoutées à ta collection !'); render(); window.scrollTo(0, 0);
}

function networkSVG(accs){

}

async function devAuth(){
  const c = (document.getElementById('d-code') || {}).value || '', c2 = document.getElementById('d-code2'), rec = store.get('rm:dev');
  const fail = m => { S.authErr = m; render(); };
  if (rec){ if (await hashPw(c, rec.salt) !== rec.hash) return fail('Code incorrect.'); }
  else { if (c.length < 6) return fail('6 caractères minimum.'); if (!c2 || c !== c2.value) return fail('Les deux codes ne correspondent pas.'); const salt = b64e(crypto.getRandomValues(new Uint8Array(16))); store.set('rm:dev', {salt, hash:await hashPw(c, salt)}); }

}

    <div class="stage"><div style="text-align:center"><div class="flip ${R.flip ? 'on' : ''}" data-action="flip"><div class="flip-in"><div class="face back t${tierIdx(c.score)}">${backSVG(tierIdx(c.score))}</div><div class="face front">${cardHTML(c, {noOpen:true, mini:true, rich:true})}</div></div></div>
      <div class="info" id="revinfo" style="${R.flip ? 'visibility:visible' : ''}"><span style="color:${t.c}">${t.n}</span> · ${x.isNew ? '🆕 Nouvelle carte !' : 'Doublon ×' + x.qty}</div>
      <div class="hint" id="revhint">${R.flip ? 'Touche pour la suivante' : 'Touche la carte pour la retourner'}</div></div></div>
    <button class="btn sec" style="max-width:420px" data-action="skip-rev">Tout révéler</button></div>`;
}
function render(){
  const y = window.scrollY;
  if (S.stage === 'dev'){ $app.innerHTML = devHTML(); window.scrollTo(0, y); return; }
  if (S.stage !== 'app'){ $app.innerHTML = landingHTML(); return; }
  const views = {home:viewHome, collection:viewCollection, create:viewCreate, friends:viewFriends, profile:viewProfile};
  const tabs = [['home', '🏠', 'Accueil'], ['collection', '🗂️', 'Collection'], ['create', '✨', 'Créer'], ['friends', '🤝', 'Amis'], ['profile', '👤', 'Compte']];
  $app.innerHTML = `<header class="hdr"><div class="wrap"><div class="logo">Rictus <span class="grad">Mortis</span></div>${S.devReturn ? '<button class="chip" data-action="dev-back">← Console dev</button>' : ''}<span class="chip"><span class="dot on"></span> ${esc(S.me)}</span></div></header>
    <main><div class="wrap">${!storageOK ? '<div class="note" style="margin:0 0 12px">⚠️ Stockage bloqué : ta progression sera perdue à la fermeture. Crée une sauvegarde depuis l’onglet Compte.</div>' : ''}${views[S.tab]()}</div></main>
    <nav><div class="row">${tabs.map(([k, i, l]) => `<button class="${S.tab === k ? 'on' : ''}" data-action="tab" data-tab="${k}"><span class="i">${i}</span>${l}${k === 'home' && S.D.boosters ? `<span class="badge">${S.D.boosters}</span>` : ''}</button>`).join('')}</div></nav>
    ${modalHTML()}${revealHTML()}`;
  window.scrollTo(0, y);
}
function refresh(){
  const a = document.activeElement;
  if (S.stage === 'app' && a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $app.contains(a)) return;
  render();
}

/* =============== événements =============== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const d = el.dataset, act = d.action;
  if (act === 'close-ov' && e.target !== el) return;
  switch (act){
    case 'mode': S.mode = d.m; S.authErr = ''; render(); break;
    case 'auth': doAuth(); break;
    case 'logout': logout(); break;
    case 'tab': S.tab = d.tab; S.modal = null; render(); window.scrollTo(0, 0); break;
    case 'open-booster': openBooster(); break;
    case 'flip': {
      const R = S.rev; if (!R) break;
      if (!R.flip){ R.flip = true; const f = document.querySelector('.flip'); if (f) f.classList.add('on'); const i = document.getElementById('revinfo'); if (i) i.style.visibility = 'visible'; const h = document.getElementById('revhint'); if (h) h.textContent = 'Touche pour la suivante'; }
      else { R.i++; R.flip = false; render(); }
      break; }
    case 'skip-rev': if (S.rev){ S.rev.i = S.rev.cards.length; render(); } break;
    case 'close-rev': S.rev = null; S.tab = 'home'; render(); break;
    case 'fcol': S.fcol = d.f; render(); break;
    case 'open-card': S.modal = {type:'card', id:d.id}; render(); break;
    case 'send-card': S.sel = new Set([d.id]); S.modal = null; S.tab = 'friends'; render(); window.scrollTo(0, 0); break;
    case 'add-friend': addFriend((document.getElementById('fr-add') || {}).value); break;
    case 'open-friend': S.modal = {type:'friend', p:d.p}; render(); break;
    case 'send-to': S.to = d.p; S.modal = null; render(); toast('Choisis les cartes à envoyer à ' + d.p); break;
    case 'del-friend': S.D.friends = S.D.friends.filter(f => lk(f.pseudo) !== lk(d.p)); if (lk(S.to) === lk(d.p)) S.to = ''; saveD(); S.modal = null; render(); break;
    case 'tf': S.tf = d.f; render(); break;
    case 'toggle-sel': if (S.sel.has(d.id)) S.sel.delete(d.id); else if (S.sel.size < 8) S.sel.add(d.id); else toast('8 cartes maximum par code.'); render(); break;
    case 'clear-sel': S.sel = new Set(); render(); break;
    case 'make-code': makeCode(); break;
    case 'my-profile': S.modal = {type:'profilecode', code:makeProfileCode()}; render(); break;
    case 'copy-code': copyText(S.modal.code); break;
    case 'share-code': try{ navigator.share({text:S.modal.code}); }catch(err){} break;
    case 'cancel-send': cancelSend(); break;
    case 'read-code': readCode(); break;
    case 'accept-import': acceptImport(); break;
    case 'generate': generate(); break;
    case 'new-card': S.cf = {title:'', desc:'', img:null, busy:false, status:'', err:'', result:null, ai:null}; render(); break;
    case 'backup': S.modal = {type:'backup', code:'CARTESSAVE1.' + b64u(JSON.stringify(S.D))}; render(); break;
    case 'restore': {
      const t = (document.getElementById('rst').value || '').replace(/\s+/g, '');
      try{ const p = t.split('.'); if (p[0] !== 'CARTESSAVE1' || p.length !== 2) throw 0; const D = JSON.parse(unb64u(p[1])); if (!D || typeof D.inv !== 'object') throw 0; S.pending = D; S.modal = {type:'confirm-restore'}; }
      catch(err){ toast('Sauvegarde invalide.'); }
      render(); break; }
    case 'do-restore': S.D = Object.assign(defaultD(), S.pending); S.pending = null; sync(); saveD(); S.modal = null; toast('Sauvegarde restaurée.'); render(); break;
    case 'pick-acc': S.mode = 'login'; S.pseudoDraft = d.p; render(); break;
    case 'dev-auth': devAuth(); break;
    case 'dev-exit': S.stage = 'landing'; S.mode = 'login'; S.modal = null; render(); break;
    case 'dev-open': S.modal = {type:'dev-acc', k:d.k}; render(); break;
    case 'dev-as': { const P = profiles(), p = P[d.k]; if (!p) break; S.me = p.pseudo; S.D = Object.assign(defaultD(), store.get('rm:data:' + d.k) || {}); S.devReturn = true; S.stage = 'app'; S.tab = 'home'; S.modal = null; sync(); render(); window.scrollTo(0, 0); break; }
    case 'dev-back': saveD(); S.me = null; S.D = null; S.devReturn = false; S.stage = 'dev'; S.modal = null; render(); break;
    case 'dev-booster': { const D = Object.assign(defaultD(), store.get('rm:data:' + d.k) || {}); D.boosters = Math.min(20, (D.boosters || 0) + 1); store.set('rm:data:' + d.k, D); toast('+1 booster offert.'); render(); break; }
    case 'dev-pw': S.modal = {type:'dev-pw', k:d.k}; render(); break;
    case 'dev-pw-ok': (async () => { const pw = (document.getElementById('d-newpw') || {}).value || ''; if (pw.length < 4) return toast('4 caractères minimum.'); const P = profiles(); if (!P[d.k]) return; const salt = b64e(crypto.getRandomValues(new Uint8Array(16))); P[d.k].salt = salt; P[d.k].hash = await hashPw(pw, salt); store.set('rm:profiles', P); S.modal = {type:'dev-acc', k:d.k}; toast('Mot de passe modifié.'); render(); })(); break;
    case 'dev-del': S.modal = {type:'dev-del', k:d.k}; render(); break;
    case 'dev-del-ok': { const P = profiles(); delete P[d.k]; store.set('rm:profiles', P); store.del('rm:data:' + d.k); const au = store.get('rm:auto'); if (au && lk(au) === d.k) store.del('rm:auto'); S.modal = null; toast('Compte supprimé.'); render(); break; }
    case 'dev-export': { const P = profiles(), data = {}; Object.keys(P).forEach(k => { data[k] = store.get('rm:data:' + k); }); S.modal = {type:'dev-export', code:'CARTESDEV1.' + b64u(JSON.stringify({profiles:P, data}))}; render(); break; }
    case 'dev-import': S.modal = {type:'dev-import'}; render(); break;
    case 'dev-import-ok': { try{ const t = (document.getElementById('d-imp').value || '').replace(/\s+/g, '').split('.'); if (t[0] !== 'CARTESDEV1' || t.length !== 2) throw 0; const o = JSON.parse(unb64u(t[1])); const P = profiles(); Object.keys(o.profiles || {}).forEach(k => { P[k] = o.profiles[k]; if (o.data && o.data[k]) store.set('rm:data:' + k, o.data[k]); }); store.set('rm:profiles', P); S.modal = null; toast('Import terminé.'); }catch(err){ toast('Export invalide.'); } render(); break; }
    case 'dev-code': S.modal = {type:'dev-code'}; render(); break;
    case 'dev-code-ok': (async () => { const c = (document.getElementById('d-code') || {}).value || ''; if (c.length < 6) return toast('6 caractères minimum.'); const salt = b64e(crypto.getRandomValues(new Uint8Array(16))); store.set('rm:dev', {salt, hash:await hashPw(c, salt)}); S.modal = null; toast('Code développeur modifié.'); render(); })(); break;
    case 'close': case 'close-ov': S.modal = null; render(); break;
  }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'cf-title') S.cf.title = e.target.value; else if (id === 'cf-desc') S.cf.desc = e.target.value; else if (id === 'imp') S.importTxt = e.target.value;
});
document.addEventListener('change', async e => {
  if (e.target.id === 'to-sel') S.to = e.target.value;
  if (e.target.id === 'cf-file' && e.target.files && e.target.files[0]){
    try{ S.cf.img = await processImage(e.target.files[0]); S.cf.err = ''; }catch(err){ S.cf.err = err.message; }
    render();
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.id) return;
  if (S.stage === 'landing' && e.target.id.startsWith('a-')) doAuth();
  if (e.target.id === 'fr-add') addFriend(e.target.value);
});
setInterval(() => {
  if (S.stage !== 'app' || !S.D || S.rev) return;
  const before = S.D.boosters; sync();
  if (S.D.boosters !== before){ saveD(); refresh(); return; }
  const t = document.querySelector('[data-timer]'); if (t) t.textContent = mmss(S.D.tickAt + EVERY - Date.now());
}, 1000);

setInterval(() => { if (S.stage === 'app' && S.D && !S.devReturn && !S.rev) saveD(); }, 30000);

/* démarrage : reconnexion automatique, collection restaurée depuis la mémoire du navigateur */
(() => {
  const all = profiles();
  let me = store.get('rm:auto'); if (!me){ try{ me = sessionStorage.getItem('rm:session'); }catch(e){} }
  if (me && all[lk(me)]){ S.me = all[lk(me)].pseudo; S.D = Object.assign(defaultD(), store.get('rm:data:' + lk(me)) || {}); S.stage = 'app'; sync(); saveD(); }
  else S.mode = Object.keys(all).length ? 'login' : 'signup';
  render();
})();
</script>
</body>
</html>
